# Netlify — static Astro site + /api/* Functions
# Cloudflare twin: wrangler.jsonc + deploy/cloudflare (root `functions` symlink)

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.15.0"

[functions]
  directory = "deploy/netlify"
  node_bundler = "esbuild"

# Prefer pnpm (matches packageManager in package.json)
[build.processing]
  skip_processing = false
